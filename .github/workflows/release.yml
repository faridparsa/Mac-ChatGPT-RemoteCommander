name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Package Release Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent RemoteCommander.app RemoteCommander.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RemoteCommander ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## RemoteCommander ${{ github.ref_name }}
            
            Apple native macOS application (SwiftUI / AppKit) that lets you control your Mac terminal directly from ChatGPT in your browser with interactive approval prompts.
            
            ### 📥 Download & Install
            1. Download **`RemoteCommander.zip`** from the Assets below.
            2. Unzip and move **`RemoteCommander.app`** to your `/Applications` folder.
            3. Double-click to launch and connect to ChatGPT in under 1 minute!
          files: |
            RemoteCommander.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
